version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LLM_PROVIDER=deterministic
      - DATABASE_URL=sqlite:///./learning_paths.db
    volumes:
      - data-volume:/app/backend
    restart: unless-stopped

volumes:
  data-volume:
